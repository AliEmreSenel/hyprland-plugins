name: Nix

on: [push, pull_request, workflow_dispatch]

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Grid and workspace preview regression checks
        run: make -C hyprexpo test CXX=${{ matrix.compiler }} CXXFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'

  build:
    uses: ./.github/workflows/nix-build.yml
